<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GREEN-API Test Task</title>
    <style>
        body { display: flex; gap: 20px; padding: 20px; font-family: sans-serif; }
        .controls { display: flex; flex-direction: column; gap: 10px; width: 300px; }
        .response { flex-grow: 1; }
        textarea { width: 100%; height: 500px; font-family: monospace; }
        input { padding: 5px; }
        button { padding: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="controls">
        <input id="idInstance" placeholder="idInstance">
        <input id="apiTokenInstance" placeholder="apiTokenInstance">
        
        <button onclick="getSettings()">getSettings</button>
        <button onclick="getStateInstance()">getStateInstance</button>
        
        <hr>
        <input id="phoneNumber" placeholder="77771234567">
        <input id="messageText" placeholder="Hello World!">
        <button onclick="sendMessage()">sendMessage</button>
        
        <hr>
        <input id="filePhoneNumber" placeholder="77771234567">
        <input id="fileUrl" placeholder="https://site.com">
        <button onclick="sendFileByUrl()">sendFileByUrl</button>
    </div>

    <div class="response">
        <label>Ответ:</label>
        <textarea id="responseField" readonly></textarea>
    </div>

    <script src="app.js"></script>
</body>
</html>
